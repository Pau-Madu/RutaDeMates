<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: a math notebook on graph paper. Students walk a winding route of exercise stops; the teacher corrects in red pen. */
:root {
  --paper: #F5F6FB;
  --grid: rgba(59, 76, 202, .07);
  --surface: #FFFFFF;
  --surface-2: #EDEFF7;
  --ink: #1B1E2E;
  --muted: #646B84;
  --line: #DCE0EC;
  --accent: #3B4CCA;
  --accent-ink: #FFFFFF;
  --pen: #D7263D;
  --pen-soft: #FCE4E7;
  --manyl: #0E9C8B;
  --lamine: #EA6A12;
  --profe: #3B4CCA;
  --ok: #1E8A57; --ok-soft: #DCF2E6;
  --warn: #A9690F; --warn-soft: #FBEFD9;
  --b-alg: #5653D4; --b-pl: #0A86A8; --b-comb: #A845C2; --b-prob: #C98F00; --b-dist: #D9513B; --b-inf: #2B9356;
  --d1: #2FA36B; --d2: #8DBB2B; --d3: #E0B000; --d4: #EA7A1F; --d5: #D7263D;
  --shadow: 0 1px 2px rgba(27,30,46,.06), 0 6px 20px rgba(27,30,46,.06);
  --wood: #B87838; --wood-shelf: #8E5A27; --wood-back: #F5E7D0;
  --f-display: "Unbounded", "Outfit", system-ui, sans-serif;
  --f-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --f-pen: "Caveat", "Comic Sans MS", cursive;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F111A; --grid: rgba(138, 151, 255, .06); --surface: #181B28; --surface-2: #222639; --ink: #E8EAF4; --muted: #9BA1B9; --line: #2D3248;
    --accent: #8C98FF; --accent-ink: #0F111A; --pen: #FF6F80; --pen-soft: #3A1C23; --manyl: #3FD3BF; --lamine: #FF9E5A; --profe: #8C98FF;
    --ok: #4DCB8C; --ok-soft: #173326; --warn: #E9AE52; --warn-soft: #382A13;
    --b-alg: #8F8CFF; --b-pl: #3DBCE0; --b-comb: #D47FEA; --b-prob: #F2C230; --b-dist: #FF7F68; --b-inf: #57C984;
    --d1: #4DCB8C; --d2: #A9D44A; --d3: #F2C230; --d4: #FF9A4D; --d5: #FF6F80;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
    --wood: #7A4E24; --wood-shelf: #5C3A19; --wood-back: #2A2219;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F111A; --grid: rgba(138, 151, 255, .06); --surface: #181B28; --surface-2: #222639; --ink: #E8EAF4; --muted: #9BA1B9; --line: #2D3248;
  --accent: #8C98FF; --accent-ink: #0F111A; --pen: #FF6F80; --pen-soft: #3A1C23; --manyl: #3FD3BF; --lamine: #FF9E5A; --profe: #8C98FF;
  --ok: #4DCB8C; --ok-soft: #173326; --warn: #E9AE52; --warn-soft: #382A13;
  --b-alg: #8F8CFF; --b-pl: #3DBCE0; --b-comb: #D47FEA; --b-prob: #F2C230; --b-dist: #FF7F68; --b-inf: #57C984;
  --d1: #4DCB8C; --d2: #A9D44A; --d3: #F2C230; --d4: #FF9A4D; --d5: #FF6F80;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.3);
  --wood: #7A4E24; --wood-shelf: #5C3A19; --wood-back: #2A2219;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1080px; margin: 0 auto; padding-block: 18px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.c-manyl { --pc: var(--manyl); } .c-lamine { --pc: var(--lamine); } .c-profe { --pc: var(--profe); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 44px; height: 44px; flex: none; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; line-height: 1.05; }
.brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--pc); color: var(--surface); display: inline-grid; place-items: center; font-weight: 700; font-family: var(--f-display); font-size: 14px; flex: none; }
.av.lg { width: 52px; height: 52px; font-size: 20px; }
.who .nm { font-weight: 700; }
.lvl { display: flex; flex-direction: column; gap: 3px; min-width: 110px; }
.lvl small { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.lvl .xbar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.lvl .xbar i { display: block; height: 100%; background: var(--pc); border-radius: inherit; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.pillbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.pillbtn:hover { border-color: var(--accent); color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; scrollbar-width: none; max-width: 100%; box-shadow: var(--shadow); }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tabs button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-selected="true"] { background: var(--pc, var(--accent)); color: var(--surface); }
.tabs .dotn { min-width: 18px; height: 18px; border-radius: 999px; background: var(--pen); color: #fff; font-size: 11px; display: inline-grid; place-items: center; padding: 0 5px; font-weight: 700; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; }

/* Cards */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2, .card h3 { margin: 0; font-family: var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.card h2 { font-size: 20px; } .card h3 { font-size: 16px; }
.eyebrow { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn.pc { background: var(--pc); color: var(--surface); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--pen); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 2px 4px; font-size: 14px; }
.linkbtn.danger { color: var(--pen); }
input[type=text], input[type=number], input[type=date], textarea, select { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 11px; font-size: 15px; min-width: 0; }
textarea { resize: vertical; width: 100%; line-height: 1.4; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
label.fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
label.fld input, label.fld textarea, label.fld select { color: var(--ink); font-weight: 500; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--surface); border-radius: 22px; padding: 22px 24px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--pc) 18%, transparent), transparent 70%); pointer-events: none; }
.hero h2 { margin: 4px 0 6px; font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 4.2vw, 32px); letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
.hero h2 span { color: var(--pc); }
.hero .sub { margin: 0; color: var(--muted); font-size: 15px; max-width: 54ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.pen { background: var(--pen-soft); color: var(--pen); }
.chip svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.bigring { width: 116px; height: 116px; position: relative; z-index: 1; }
.bigring circle { fill: none; stroke-width: 11; }
.bigring .trk { stroke: var(--surface-2); }
.bigring .fg { stroke: var(--pc); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); }
.bigring .t1 { font-family: var(--f-display); font-weight: 800; font-size: 30px; fill: var(--ink); }
.bigring .t2 { font-family: var(--f-body); font-size: 12px; fill: var(--muted); font-weight: 600; }

/* Route */
.routewrap { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 12px 10px 6px; }
.route { width: 100%; max-width: 780px; display: block; margin: 0 auto; height: auto; }
.route .trk { fill: none; stroke: var(--line); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 2 16; }
.route .trk.on { stroke: var(--pc); stroke-dasharray: none; opacity: .55; }
.route .node { cursor: pointer; }
.route .node:focus { outline: none; }
.route .node:focus-visible .disc { stroke: var(--accent); stroke-width: 6; }
.route .disc { fill: var(--surface); stroke: var(--line); stroke-width: 4; transition: transform .2s; }
.route .st-part .disc { stroke: var(--pc); stroke-dasharray: 10 7; }
.route .st-done .disc { fill: var(--pc); stroke: var(--pc); }
.route .blk { fill: none; stroke-width: 6; stroke-linecap: round; }
.route .num { font-family: var(--f-display); font-weight: 800; font-size: 30px; fill: var(--ink); pointer-events: none; }
.route .st-done .num { fill: var(--surface); }
.route .lab { font-family: var(--f-body); font-weight: 600; font-size: 17px; fill: var(--muted); pointer-events: none; }
.route .halo { fill: none; stroke: var(--pc); stroke-width: 4; opacity: .5; }
.route .sel .halo { animation: halo 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .15; transform: scale(1.08); } }
.route .chk circle { fill: var(--ok); stroke: var(--surface); stroke-width: 3; }
.route .chk path { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.route .grade circle { fill: var(--surface); stroke: var(--pen); stroke-width: 3; }
.route .grade text { font-family: var(--f-pen); font-weight: 700; font-size: 21px; fill: var(--pen); }
.route .goal .disc { fill: var(--surface-2); stroke: var(--pc); stroke-width: 4; }
.route .goal.st-done .disc { fill: var(--pc); }
.route .goal path.flag { fill: var(--pc); }
.route .goal.st-done path.flag { fill: var(--surface); }
.route .goal path.pole { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
.route .goal.st-done path.pole { stroke: var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12.5px; color: var(--muted); padding: 6px 6px 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* Exercise sheet */
.sheet { border: 2px solid color-mix(in srgb, var(--pc) 40%, var(--line)); }
.sheet-head { display: flex; gap: 14px; align-items: flex-start; }
.exnum { width: 54px; height: 54px; border-radius: 16px; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: #fff; background: var(--bc); }
.sheet-head h2 { font-size: 19px; line-height: 1.2; }
.blocktag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--bc); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { background: var(--paper); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border: 1.5px solid transparent; }
.step.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.step-h { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
.step-h .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); color: var(--muted); flex: none; }
.step.ok .step-h .n { background: var(--ok); color: #fff; }
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.ph { position: relative; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; flex: none; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0; }
.ph .x.ask { width: auto; padding: 0 8px; border-radius: 999px; background: var(--pen); font-size: 12px; font-weight: 700; }
.addph { width: 84px; height: 84px; border-radius: 12px; border: 2px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; background: var(--surface); text-align: center; flex: none; }
.addph:hover, .addph:focus-within { border-color: var(--pc); color: var(--pc); }
.addph svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.addph.busy { border-style: solid; border-color: var(--pc); color: var(--pc); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.diff { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.diff button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.diff button small { font-family: var(--f-body); font-weight: 600; font-size: 10.5px; }
.diff button[aria-pressed="true"] { background: var(--dc); border-color: var(--dc); color: #fff; transform: translateY(-2px); box-shadow: 0 4px 10px color-mix(in srgb, var(--dc) 35%, transparent); }
.diff .lv1 { --dc: var(--d1); } .diff .lv2 { --dc: var(--d2); } .diff .lv3 { --dc: var(--d3); } .diff .lv4 { --dc: var(--d4); } .diff .lv5 { --dc: var(--d5); }
.dlabel { font-size: 13px; font-weight: 600; color: var(--muted); min-height: 18px; }
.timebox { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.timebox input { width: 74px; text-align: center; font-family: var(--f-mono); font-size: 17px; font-weight: 600; }
.timebox .unit { font-size: 13px; color: var(--muted); }
.stepbtn { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; }
.chrono { border: 1.5px solid var(--pc); color: var(--pc); background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; display: inline-flex; gap: 7px; align-items: center; align-self: flex-start; }
.chrono svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.chrono.run { background: var(--pc); color: var(--surface); animation: pulse2 2s ease-in-out infinite; }
.chrono .tm { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
@keyframes pulse2 { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc) 45%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.sheet-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.qnote { display: flex; flex-direction: column; gap: 6px; }
.qnote label { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.penbox { border-left: 4px solid var(--pen); background: var(--pen-soft); border-radius: 0 12px 12px 0; padding: 10px 14px; display: flex; gap: 14px; align-items: center; }
.penbox .sc { font-family: var(--f-pen); font-weight: 700; font-size: 40px; line-height: .9; color: var(--pen); flex: none; }
.penbox .sc small { font-size: 22px; }
.penbox p { margin: 0; font-family: var(--f-pen); font-size: 22px; line-height: 1.15; color: var(--pen); overflow-wrap: anywhere; }

/* Goal / mood */
.moods { display: flex; gap: 8px; flex-wrap: wrap; }
.moodbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 8px 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; font-size: 12px; font-weight: 600; color: var(--muted); transition: transform .15s; }
.moodbtn svg { width: 46px; height: 46px; }
.moodbtn[aria-pressed="true"] { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 10%, var(--surface)); color: var(--ink); transform: scale(1.06); }
.moodbtn:not([aria-pressed="true"]) svg { filter: saturate(.35); opacity: .8; }
.delivered { display: flex; gap: 14px; align-items: center; background: var(--ok-soft); color: var(--ok); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.delivered svg { width: 44px; height: 44px; flex: none; }

/* Correction card for student */
.corr { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface); border-radius: 22px; padding: 20px 22px; box-shadow: var(--shadow); border: 2px solid var(--pen); position: relative; }
.stamp { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--pen); display: grid; place-items: center; transform: rotate(-8deg); flex: none; }
.stamp b { font-family: var(--f-pen); font-weight: 700; font-size: 58px; color: var(--pen); line-height: 1; }
.stamp small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--pen); text-align: center; margin-top: -4px; }
.corr .cm { margin: 6px 0 0; font-family: var(--f-pen); font-size: 25px; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
.review { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }

.rvchip { border: 1.5px solid var(--pen); color: var(--pen); background: transparent; border-radius: 999px; padding: 4px 11px; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }

.rvchip[aria-pressed="true"] { background: var(--pen); color: #fff; }

/* PDF pane */
.pdfpane { display: flex; flex-direction: column; gap: 12px; }
.pdfbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }

.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump button { border: 1.5px solid var(--bc, var(--line)); color: var(--bc, var(--ink)); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-weight: 600; font-size: 13px; }
.jump button:hover { background: color-mix(in srgb, var(--bc, var(--accent)) 12%, var(--surface)); }
.pages { display: flex; flex-direction: column; gap: 14px; align-items: center; }

.pg { position: relative; width: 100%; max-width: 860px; }
.pg .pn { position: absolute; top: 8px; right: 10px; font-family: var(--f-mono); font-size: 12px; background: rgba(27,30,46,.7); color: #fff; border-radius: 6px; padding: 1px 7px; }
.pgflash canvas { outline: 4px solid var(--accent); outline-offset: 3px; }
.empty { padding: 26px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 54px; height: 54px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .6; }

/* Teacher */
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stu { gap: 12px; }
.stu-h { display: flex; align-items: center; gap: 12px; }
.stu-h h3 { font-size: 19px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px 14px; }
.stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.stat .v svg { width: 26px; height: 26px; }
.pbar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--pc); border-radius: inherit; }
.tablewrap { overflow-x: auto; }
table.heat { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; font-size: 14px; }
.heat th, .heat td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; }
.heat th:first-child, .heat td:first-child { text-align: left; }
.heat thead th { font-size: 12px; color: var(--muted); font-weight: 700; }
.heat .exn { display: flex; align-items: center; gap: 8px; min-width: 0; }
.heat .exn b { width: 24px; height: 24px; border-radius: 7px; display: inline-grid; place-items: center; background: var(--bc); color: #fff; font-size: 12px; flex: none; font-family: var(--f-display); }
.heat .exn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.dcell { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.dsq { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px; background: var(--dc, var(--surface-2)); }
.dsq.none { color: var(--muted); }
.lv1 { --dc: var(--d1); } .lv2 { --dc: var(--d2); } .lv3 { --dc: var(--d3); } .lv4 { --dc: var(--d4); } .lv5 { --dc: var(--d5); }
.doubts { display: flex; flex-direction: column; gap: 8px; }
.doubt { border-left: 3px solid var(--pc); background: var(--paper); border-radius: 0 10px 10px 0; padding: 8px 12px; font-size: 14.5px; }
.doubt b { font-size: 13px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 8px 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--pc); color: var(--surface); }
.gx { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.gx .photos .ph { width: 128px; height: 128px; }
.gx-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.gradebox { display: flex; flex-direction: column; gap: 10px; background: var(--pen-soft); border-radius: 14px; padding: 12px; }
.gradebox .row input { width: 84px; text-align: center; font-family: var(--f-pen); font-size: 28px; font-weight: 700; color: var(--pen); padding: 2px 6px; background: var(--surface); }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.quick button { border: 1.5px solid var(--pen); color: var(--pen); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-weight: 700; font-size: 13px; font-family: var(--f-mono); }
.quick button[aria-pressed="true"] { background: var(--pen); color: #fff; }
.gradebox textarea { background: var(--surface); font-family: var(--f-pen); font-size: 21px; color: var(--pen); line-height: 1.15; }
.finalbox { border: 2px solid var(--pen); }
.finalrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.finalrow .auto { font-family: var(--f-pen); font-size: 52px; color: var(--pen); font-weight: 700; line-height: 1; }
.finalrow input { width: 96px; text-align: center; font-family: var(--f-pen); font-size: 30px; color: var(--pen); font-weight: 700; }
.pubrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; font-weight: 700; padding: 4px 0; }
.toggle .sw { width: 46px; height: 26px; border-radius: 999px; background: var(--surface-2); border: 1.5px solid var(--line); position: relative; transition: background .2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.toggle[aria-pressed="true"] .sw { background: var(--ok); border-color: var(--ok); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(20px); }
.exlist { display: flex; flex-direction: column; gap: 8px; }
.exrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) 160px 36px; gap: 8px; align-items: center; }
.exrow b { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--bc); color: #fff; font-family: var(--f-display); font-size: 13px; }
.exrow .del { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; line-height: 1; padding: 0; }
.exrow .del:hover { color: var(--pen); border-color: var(--pen); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.filebtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px dashed var(--accent); color: var(--accent); border-radius: 12px; padding: 9px 14px; font-weight: 700; cursor: pointer; background: var(--surface); }
.filebtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Evolution */
.chart { width: 100%; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .gl.mid { stroke-dasharray: 4 5; }
.chart .ax { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.chart .xl { font-family: var(--f-body); font-size: 13px; fill: var(--muted); font-weight: 600; }
.chart .ln { fill: none; stroke: var(--pc); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.chart .ar { fill: var(--pc); opacity: .1; }
.chart .pt { fill: var(--surface); stroke: var(--pc); stroke-width: 3.5; }
.chart .pt.last { fill: var(--pc); }
.chart .vl { font-family: var(--f-pen); font-size: 22px; font-weight: 700; fill: var(--pc); }
.mast { display: flex; flex-direction: column; gap: 10px; }
.mrow { display: grid; grid-template-columns: 130px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 14px; }
.mrow .nm { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.mrow .nm i { width: 10px; height: 10px; border-radius: 50%; background: var(--bc); flex: none; }
.mrow .bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.mrow .bar i { display: block; height: 100%; background: var(--bc); border-radius: inherit; }
.mrow .v { font-family: var(--f-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.hist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.hist li:last-child { border-bottom: 0; }
.hist .ht { font-weight: 700; }
.hist .hm { font-size: 13px; color: var(--muted); }
.hist .hc { grid-column: 1 / -1; font-family: var(--f-pen); font-size: 21px; color: var(--pen); line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.hist .hn { display: flex; gap: 12px; align-items: center; }
.hist .hn span { font-family: var(--f-pen); font-weight: 700; font-size: 30px; color: var(--pc); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.badge { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; border-radius: 14px; background: var(--paper); }
.medal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--pc) 16%, var(--surface)); border: 2.5px solid var(--pc); color: var(--pc); }
.medal svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.badge.off { opacity: .6; }
.badge.off .medal { background: var(--surface-2); border-color: var(--line); color: var(--muted); }
.badge strong { font-size: 14.5px; display: block; }
.badge span { font-size: 12.5px; color: var(--muted); }

/* Modal / lightbox / toast */
.modal { position: fixed; inset: 0; background: rgba(12,14,24,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--surface); border-radius: 22px; padding: 24px; width: min(480px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); }
.modal h2 { margin: 0; font-family: var(--f-display); font-size: 22px; }
.modal p { margin: 0; color: var(--muted); }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.pick button { border: 2px solid var(--pc); background: var(--surface); color: var(--pc); border-radius: 18px; padding: 18px 10px; font-family: var(--f-display); font-size: 17px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pick button:hover { background: color-mix(in srgb, var(--pc) 10%, var(--surface)); }
.lightbox { position: fixed; inset: 0; background: rgba(6,8,14,.94); z-index: 60; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); gap: 10px; }
.lb-stage { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; }
.lb-stage.zoom { place-items: start; }
.lb-frame { position: relative; flex: none; transition: transform .25s; width: 60vmin; height: 60vmin; }
.lb-frame img { width: 100%; height: 100%; display: block; background: #fff; border-radius: 6px; }
.lb-frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lb-frame svg.edit { cursor: crosshair; touch-action: none; }
.lb-frame svg.edit.tool-move { cursor: grab; pointer-events: none; }
.mk-pen { fill: none; stroke: #D7263D; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.mk-text { font-family: var(--f-pen); font-weight: 700; fill: #D7263D; paint-order: stroke; stroke: rgba(255,255,255,.75); stroke-width: 5px; }
.lb-tools { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; align-items: center; }
.lb-tools button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 12px; padding: 7px 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.lb-tools button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.lb-tools button[aria-pressed="true"] { background: #D7263D; border-color: #D7263D; }
.lb-tools button:disabled { opacity: .4; }
.lb-tools input { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 7px 10px; font-family: var(--f-pen); font-size: 20px; width: 220px; max-width: 60vw; }
.lb-tools .sep { width: 1px; height: 24px; background: rgba(255,255,255,.25); }
.lb-saved { font-size: 12.5px; color: #B9C0D6; }
.ph .mko { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ph .mko .mk-pen { stroke-width: 16; }
.ph .mko .mk-text { stroke-width: 0; }
.ph .mkb { position: absolute; left: 4px; bottom: 4px; background: #D7263D; color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 7px; pointer-events: none; }
.lb-bar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: center; color: #E8EAF4; font-size: 14px; }
.lb-bar button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 12px; font-size: 14.5px; z-index: 70; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Avatar (monigote) */
.avatar { display: block; flex: none; }
.avbtn { border: 0; background: transparent; padding: 0; border-radius: 50%; position: relative; display: inline-flex; }
.avbtn .pn2 { position: absolute; right: -3px; bottom: -3px; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--pc); color: var(--pc); display: grid; place-items: center; }
.avbtn .pn2 svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.avbtn:hover .avatar { transform: rotate(-6deg) scale(1.05); }
.avbtn .avatar { transition: transform .2s; }
.route .walker { animation: hop .8s cubic-bezier(.3,1.3,.5,1) both; }
.route .bob { animation: bob 2.4s ease-in-out infinite; }
.route .shadow { fill: rgba(0,0,0,.16); }
@keyframes hop { from { transform: translate(var(--dx, 0px), var(--dy, 0px)); } to { transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.hero.hero3 { grid-template-columns: auto minmax(0, 1fr) auto; }
.heroav { position: relative; z-index: 1; }
.heroav .avatar { filter: drop-shadow(0 6px 12px rgba(0,0,0,.12)); }
.chip.cta { border: 1.5px dashed var(--pc); background: transparent; color: var(--pc); cursor: pointer; }

/* Poses */
.avatar .arm-r { transform-origin: 88px 100px; }
.avatar .arm-l { transform-origin: 32px 100px; }
.waving .arm-r { animation: wave .45s ease-in-out infinite alternate; }
.cheering .arm-r, .cheering .arm-l { animation: cheer .4s ease-in-out infinite alternate; }
.cheering .arm-l { animation-direction: alternate-reverse; }
@keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(16deg); } }
@keyframes cheer { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-3px); } }
.route .poke { cursor: pointer; }

/* Chests on the route */
.route .chest { cursor: default; }
.route .chest.locked { filter: grayscale(1); opacity: .45; }
.route .chest.ready { cursor: pointer; }
.route .chest.ready .cbody { animation: cbounce 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.route .chest .glow { fill: var(--d3); opacity: .28; animation: halo 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.route .chest.open { opacity: .75; }
.route .chest:focus { outline: none; }
.route .chest:focus-visible .cbody { filter: drop-shadow(0 0 4px var(--accent)); }
@keyframes cbounce { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-9px) scale(1.04, .97); } 60% { transform: translateY(0) scale(1.06, .92); } }
.chestbox { text-align: center; align-items: center; }
.bigchest { width: 150px; height: 130px; margin: 0 auto; }
.bigchest.shake { animation: cshake .8s ease-in-out; }
@keyframes cshake { 0%, 100% { transform: none; } 15% { transform: translateX(-7px) rotate(-6deg); } 30% { transform: translateX(7px) rotate(6deg); } 45% { transform: translateX(-5px) rotate(-4deg); } 60% { transform: translateX(5px) rotate(4deg); } 75% { transform: translateX(-2px) rotate(-2deg); } }

.rays2 { opacity: 0; transition: opacity .4s; }
.bigchest.opened .rays2 { opacity: 1; animation: spin 10s linear infinite; transform-box: fill-box; transform-origin: center; }
.prize { display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; animation: rise .5s .2s both; }
.prize .xp { font-family: var(--f-display); font-weight: 800; font-size: 28px; color: var(--warn); }

/* Flying coins */
.coinfly { position: fixed; left: 0; top: 0; width: 28px; height: 28px; z-index: 85; pointer-events: none; }
.lvl.gain .xbar { animation: gain .5s ease; }
@keyframes gain { 50% { transform: scaleY(1.9); filter: brightness(1.3); } }

/* Trophy cabinet */
.vitrina { background: var(--wood-back); border: 10px solid var(--wood); border-radius: 20px; padding: 18px 10px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 118px), 1fr)); row-gap: 20px; box-shadow: inset 0 6px 14px rgba(0,0,0,.12); }
.vcell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 6px 10px; border-bottom: 9px solid var(--wood-shelf); min-width: 0; }
.vcell .art { height: 74px; display: grid; place-items: end center; }
.vcell .art > svg { filter: drop-shadow(0 4px 4px rgba(0,0,0,.18)); }
.vcell.sil .art > svg { filter: brightness(0); opacity: .16; }
.vcell strong { font-size: 13px; line-height: 1.2; }
.vcell span { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.vcell.sil strong { color: var(--muted); }

/* Intro: logo drop and bands */
.intro .ilogo { width: 96px; height: 96px; animation: drop .85s cubic-bezier(.3,1.45,.5,1) .1s both; filter: drop-shadow(0 10px 10px rgba(0,0,0,.18)); position: relative; z-index: 1; }
@keyframes drop { from { transform: translateY(-180px) scale(.85) rotate(-10deg); opacity: 0; } 50% { opacity: 1; } to { transform: none; opacity: 1; } }
.intro .scene { animation: thud .35s .72s ease-out; position: relative; z-index: 1; }
@keyframes thud { 35% { transform: translateY(7px) scaleY(.98); } }
.intro .boom { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 4px solid var(--pc); opacity: 0; animation: boom .7s .75s ease-out; }
@keyframes boom { from { transform: scale(.6); opacity: .8; } to { transform: scale(2.6); opacity: 0; } }
.intro .bands { position: absolute; inset: -30%; display: flex; transform: rotate(-14deg); pointer-events: none; }
.intro .bands i { flex: 1; background: var(--bc); opacity: .13; transform: scaleY(0); transform-origin: top; animation: band .7s calc(var(--k) * 80ms) cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes band { to { transform: scaleY(1); } }
.intro > :not(.bands) { position: relative; z-index: 1; }
.ihead { display: grid; place-items: center; }
.ed-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.ed-tools button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 700; }
.ed-tools button[aria-pressed="true"] { border-color: var(--pc); color: var(--pc); }
.ed-tools button:disabled { opacity: .4; }

/* Avatar editor */
.modal .box.editor { width: min(760px, 100%); }

function loadImg(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image(); img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("format")); }; img.src = url; });
}
function draw(img, max) {
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); return c;
}
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
async function onPhoto(n, file) {
  const st = student(); if (!file || !st || !S.db) return;
  if (S.readOnly) { toast("Con este acceso no puedes subir fotos."); return; }
  const used = photosOf(st, n).map(p => p.k); const k = [0, 1, 2].find(i => !used.includes(i));
  if (k == null) { toast(`Máximo ${MAX_PH} fotos por ejercicio. Borra una para cambiarla.`); return; }
  const key = st + n; S.uploading[key] = true; render();
  let img, url;
  try { ({ img, url } = await loadImg(file)); } catch { delete S.uploading[key]; render(); toast("No se puede leer esa imagen. Prueba con una foto JPG o PNG."); return; }
  try {
    const thumb = draw(img, 320).toDataURL("image/jpeg", .7);
    let full = draw(img, 1700).toDataURL("image/jpeg", .72);
    if (full.length > 900000) full = draw(img, 1400).toDataURL("image/jpeg", .62);
    if (full.length > 900000) full = draw(img, 1100).toDataURL("image/jpeg", .55);
    URL.revokeObjectURL(url);
    const id = `${S.rid}__${st}__${n}__${k}`, doc = { rid: S.rid, st, n: Number(n), k, thumb, at: new Date().toISOString(), by: S.uid || null };
    const before = exState(st, n).done;
    await withTimeout(S.db.doc("photofull/" + id).set({ rid: S.rid, st, data: full }), 60000);
    S.full[id] = full;
    await withTimeout(S.db.doc("photos/" + id).set(doc), 30000);
    S.photos[id] = doc;
    if (!before && exState(st, n).done) celebrateEx(st, n); else toast("Foto guardada");
    touchSub(st);
  } catch (e) { console.warn("photo", e); writeError(e); }
  finally { delete S.uploading[key]; render(); }
}
async function delPhoto(id) {
  const p = S.photos[id]; if (!p) return;
  try { await S.db.doc("photos/" + id).delete(); await S.db.doc("photofull/" + id).delete().catch(() => {}); delete S.photos[id]; delete S.full[id]; toast("Foto borrada"); }
  catch (e) { writeError(e); }

}
const phSrc = p => S.full[`${p.rid}__${p.st}__${p.n}__${p.k}`] || p.data || p.thumb;
async function loadFull(p) {
  const id = `${p.rid}__${p.st}__${p.n}__${p.k}`; if (S.full[id] || p.data) return;
  try { const d = await S.db.doc("photofull/" + id).get(); if (d.exists && d.data().data) { S.full[id] = d.data().data; if (S.lb && lbPhoto() === p) { const im = $("lb-img"); if (im) { im.onload = fitLb; im.src = S.full[id]; } } } } catch (e) { console.warn("full", e); }

/* Student: progress */
function roundsFor(st) {
  const r = S.history.map(h => ({ id: h.id, title: h.title, at: h.closedAt, s: (h.students || {})[st] || {} }));
  const g = pubGrade(st);
  if (g && finalOf(g) != null) r.push({ id: S.rid, title: S.exam.title, at: g.publishedAt, current: true, s: { final: finalOf(g), comment: g.comment, review: g.review, minutes: totalMin(st), mood: subOf(st).mood, scores: Object.fromEntries(exercises().map(x => [x.n, scoreOf(g, x.n)])), blocks: Object.fromEntries(exercises().map(x => [x.n, bk(x.block)])) } });
  return r;
}
function chartSvg(series) {
  const all = series.flatMap(s => s.pts);
  if (!all.length) return `<div class="empty">${ICON.chart}<strong>Aún no hay notas</strong><span>Cuando el profe publique la primera corrección, aquí verás tu línea de evolución.</span></div>`;
  const labels = []; series.forEach(s => s.pts.forEach(p => { if (!labels.includes(p.label)) labels.push(p.label); }));
  const W = 640, H = 260, L = 40, R = 20, T = 24, B = 40, iw = W - L - R, ih = H - T - B;
  const X = i => L + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)), Y = v => T + ih * (1 - v / 10);
  let h = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de las notas">`;
  [0, 2.5, 5, 7.5, 10].forEach(v => { h += `<line class="gl${v % 5 ? " mid" : ""}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>${v % 5 ? "" : `<text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`}`; });
  labels.forEach((l, i) => { h += `<text class="xl" x="${X(i)}" y="${H - 14}" text-anchor="middle">${esc(l.length > 14 ? l.slice(0, 13) + "…" : l)}</text>`; });
  series.forEach(s => {
    const pts = s.pts.map(p => [X(labels.indexOf(p.label)), Y(p.v), p.v]);
    if (pts.length > 1) { h += `<g class="c-${s.st}"><path class="ar" d="M${pts[0][0]} ${Y(0)} ${pts.map(p => `L${p[0]} ${p[1]}`).join(" ")} L${pts[pts.length - 1][0]} ${Y(0)}Z"/><path class="ln" d="${pts.map((p, i) => `${i ? "L" : "M"}${p[0]} ${p[1]}`).join(" ")}"/></g>`; }
    h += `<g class="c-${s.st}">${pts.map((p, i) => `<circle class="pt${i === pts.length - 1 ? " last" : ""}" cx="${p[0]}" cy="${p[1]}" r="6"/><text class="vl" x="${p[0]}" y="${p[1] - 12}" text-anchor="middle">${esc(fmtN(p[2], 1))}</text>`).join("")}</g>`;
  });
  return h + "</svg>";
}
function mastery(rounds) {
  const acc = {}; rounds.forEach(r => { const sc = r.s.scores || {}, bl = r.s.blocks || {}; Object.keys(sc).forEach(n => { if (sc[n] == null) return; const b = bl[n] || "alg"; (acc[b] = acc[b] || []).push(sc[n]); }); });
  const rows = BKEYS.filter(b => acc[b]).map(b => { const v = acc[b].reduce((a, c) => a + c, 0) / acc[b].length; return `<div class="mrow" style="--bc:var(--b-${b})"><span class="nm"><i></i>${esc(BLOCKS[b].name)}</span><span class="bar"><i style="width:${v * 10}%"></i></span><span class="v">${fmtN(v, 1)}</span></div>`; });
  return rows.length ? `<div class="mast">${rows.join("")}</div>` : `<p class="muted small">Se rellena con las notas de cada ejercicio corregido.</p>`;
}
function badgeList(st) {
  const rounds = roundsFor(st), finals = rounds.map(r => r.s.final).filter(v => v != null);
  const hist = S.history.map(h => (h.students || {})[st] || {});
  const anyDiff5 = exercises().some(x => exOf(st, x.n).diff === 5 && exState(st, x.n).done) || hist.some(s => s.brave);
  const fullRounds = hist.filter(s => s.done && s.done === s.total).length + (doneCount(st) === exercises().length && exercises().length ? 1 : 0);
  const delivered = hist.filter(s => s.submitted).length + (subOf(st).submittedAt ? 1 : 0);
  const improved = finals.some((v, i) => i > 0 && v > finals[i - 1]);
  const allTime = exercises().length && exercises().every(x => exOf(st, x.n).min > 0);
  const B = [
    ["rocket", "Primer paso", "Completa tu primer ejercicio", doneCount(st) > 0 || hist.some(s => s.done > 0)],
    ["flag", "Ruta completa", "Termina todos los ejercicios de un examen", fullRounds > 0],
    ["mountain", "Valiente", "Completa un ejercicio que te pareció muy difícil (5)", anyDiff5],
    ["timer", "Reloj suizo", "Apunta el tiempo de todos los ejercicios", allTime || hist.some(s => s.allTime)],
    ["star", "Notable", "Saca un 7 o más", finals.some(v => v >= 7)],
    ["trophy", "Sobresaliente", "Saca un 9 o más", finals.some(v => v >= 9)],
    ["up", "Remontada", "Mejora tu nota respecto al examen anterior", improved],
    ["bolt", "Constancia", "Entrega 3 exámenes", delivered >= 3],
  ];
  return B;
}
function medalSvg(ic, k) {
  const rib = [["#3B4CCA", "#D7263D"], ["#0E9C8B", "#F2C230"], ["#A845C2", "#EA6A12"], ["#2B9356", "#3B4CCA"]][k % 4];
  return `<svg viewBox="0 0 64 74" width="58" height="67" aria-hidden="true"><path d="M14 0 h13 l11 26 h-13z" fill="${rib[0]}"/><path d="M50 0 h-13 l-11 26 h13z" fill="${rib[1]}"/><circle cx="32" cy="48" r="23" fill="#F2C230" stroke="#B8860B" stroke-width="3"/><circle cx="32" cy="48" r="16" fill="#FFD95A"/><path d="M18 40 a16 16 0 0 1 12 -8" stroke="#fff" stroke-opacity=".6" stroke-width="3" fill="none" stroke-linecap="round"/>${ICON[ic].replace("<svg ", '<svg x="20" y="36" width="24" height="24" fill="none" stroke="#8A5A00" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" ')}</svg>`;
}

    const on = owns(st, key), a = Object.assign({}, avData(st), key === "galaxia" ? { bg: 8 } : ["sigma", "chaqueta"].includes(key) ? { style: key } : { acc: key });
    cells.push(`<div class="vcell ${on ? "" : "sil"}"><div class="art">${on ? avatarSvg(a, { size: 66 }) : chestSvg("closed", 62)}</div><strong>${on ? esc(name) : "Premio de cofre"}</strong><span>${on ? "Ya lo puedes poner en tu monigote" : "Completa un bloque y abre su cofre"}</span></div>`);
  });
  const got = badgeList(st).filter(b => b[3]).length + CHEST_ITEMS.filter(([k]) => owns(st, k)).length;

  if (a === "newround") return openNewRound();
  if (a === "donewround") return newRound(t);
  if (a === "askhist") { S.delRound = t.dataset.id; return render(); }
  if (a === "delhist") { try { await S.db.doc("history/" + t.dataset.id).delete(); toast("Prueba quitada del archivo"); } catch (er) { writeError(er); } S.delRound = null; return render(); }
});
document.addEventListener("keydown", e => {
  if (S.lb && isProfe() && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); const b = document.querySelector('[data-act="lbundo"]'); if (b && !b.disabled) b.click(); return; }
  if (e.key === "Escape") { if (document.querySelector(".intro")) closeIntro(); else if (S.lb) { S.lb = null; render(); renderLb(); } else if (!$("modal").hidden && S.me) closeModal(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("g.node, g.chest.ready")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
document.addEventListener("input", e => {
  const t = e.target, st = student();
  if (t.dataset.min && st) { setEx(st, t.dataset.min, { min: clamp(parseInt(t.value, 10) || 0, 0, 600) }); return; }
  if (t.dataset.note && st) { setEx(st, t.dataset.note, { note: t.value.slice(0, 500) }); return; }
  if (t.dataset.moodnote && st) { const s = S.subs[st] = S.subs[st] || { ex: {} }; s.moodNote = t.value.slice(0, 500); touchSub(st); return; }
  const g = () => { const x = S.grades[S.gStu] = S.grades[S.gStu] || { ex: {} }; x.ex = x.ex || {}; return x; };
  if (t.dataset.score) { const v = parseFloat(String(t.value).replace(",", ".")); const x = g(); x.ex[t.dataset.score] = Object.assign({}, x.ex[t.dataset.score], { score: isNaN(v) ? null : clamp(v, 0, 10) }); touchGrade(S.gStu); return; }
  if (t.dataset.gnote) { const x = g(); x.ex[t.dataset.gnote] = Object.assign({}, x.ex[t.dataset.gnote], { note: t.value.slice(0, 500) }); touchGrade(S.gStu); return; }
  if (t.dataset.final) { const v = parseFloat(String(t.value).replace(",", ".")); g().final = isNaN(v) ? null : clamp(v, 0, 10); touchGrade(S.gStu); return; }
  if (t.dataset.comment) { g().comment = t.value.slice(0, 1200); touchGrade(S.gStu); return; }
  if (t.dataset.draft) { S.draft[t.dataset.draft] = t.value; return; }
  if (t.dataset.lbtext && S.lb) { S.lb.text = t.value; return; }
  if (t.dataset.ext) { S.draft.exercises[t.dataset.ext].title = t.value.slice(0, 120); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.photo && t.files && t.files[0]) { onPhoto(Number(t.dataset.photo), t.files[0]); t.value = ""; return; }
  if (t.dataset.exb) { S.draft.exercises[t.dataset.exb].block = t.value; render(); return; }
  if (t.dataset.pdf && t.files && t.files[0]) { uploadPdf(t.dataset.pdf, t.files[0]); t.value = ""; return; }
  if (t.dataset.score || t.dataset.final) setTimeout(render, 0); // tras mover el foco, para no perder lo que se escribe en la siguiente casilla
});
document.addEventListener("focusout", e => { if (e.target.dataset && (e.target.dataset.min)) setTimeout(render, 0); });

/* ---------- teacher actions ---------- */
async function uploadPdf(kind, file) {
  if (file.type !== "application/pdf") return toast("Tiene que ser un archivo PDF.");
  S.uploading[kind] = true; render();
  try {
    const id = await withTimeout(savePdfFile(file), 180000);
    if (kind === "exam") { S.exam = Object.assign({}, S.exam, { pdfFile: id, pdfUrl: null }); await S.db.doc("exam/current").set(S.exam); }
    else { S.guia = { pdfFile: id, at: new Date().toISOString() }; await S.db.doc("config/guia").set(S.guia); }
    S.pdf.url = null; toast("PDF actualizado");
  } catch (e) { console.warn(e); toast(e && e.code === "too-big" ? "El PDF pasa de 8 MB. Compímelo o quita páginas." : "No se pudo subir el PDF. Inténtalo otra vez."); }
  finally { delete S.uploading[kind]; render(); }
}
async function saveExam() {
  const d = S.draft; if (!d) return;
  const ex = d.exercises.slice(0, MAX_EX).map((x, i) => ({ n: i + 1, title: (x.title || "").trim() || "Ejercicio " + (i + 1), block: bk(x.block) }));
  const next = Object.assign({}, S.exam, { title: d.title.trim() || "Examen", subtitle: d.subtitle.trim(), due: d.due || null, exercises: ex });
  try { await S.db.doc("exam/current").set(next); S.exam = next; S.draft = null; toast("Examen guardado"); } catch (e) { writeError(e); }
  render();
}
function summaryFor(st) {
  const sub = subOf(st), g = gradeOf(st), ex = exercises();
  return {
    final: finalOf(g), published: !!(g && g.published), comment: (g && g.comment) || "", review: (g && g.review) || [],
    scores: Object.fromEntries(ex.map(x => [x.n, scoreOf(g, x.n)])), blocks: Object.fromEntries(ex.map(x => [x.n, bk(x.block)])),
    minutes: totalMin(st), avgDiff: avgDiff(st), mood: sub.mood || null, done: doneCount(st), total: ex.length,
    submitted: !!sub.submittedAt, brave: ex.some(x => exOf(st, x.n).diff === 5 && exState(st, x.n).done), allTime: ex.every(x => exOf(st, x.n).min > 0),
    xp: (() => { const s = subOf(st), f = finalOf(g); return doneCount(st) * 10 + (s.submittedAt ? 30 : 0) + (f != null ? Math.round(f * 6) : 0); })(),
  };
}
async function newRound(btn) {
  const title = ($("nr-title").value || "").trim() || "Examen nuevo", sub = ($("nr-sub").value || "").trim(), n = clamp(parseInt($("nr-n").value, 10) || 12, 1, MAX_EX), due = $("nr-due").value || null;
  const file = $("nr-pdf") && $("nr-pdf").files && $("nr-pdf").files[0];
  btn.disabled = true; btn.textContent = "Archivando…";
  try {
    const rid = S.rid, old = S.exam || {};
    if (rid && exercises().length) {
      await S.db.doc("history/" + rid).set(JSON.parse(JSON.stringify({ id: rid, title: old.title || "Examen", subtitle: old.subtitle || "", startedAt: old.startedAt || null, closedAt: new Date().toISOString(), exercises: exercises(), students: Object.fromEntries(STUDENTS.map(st => [st, summaryFor(st)])) })));
      const snap = await S.db.collection("photos").where("rid", "==", rid).get();
      for (const d of snap.docs) { await S.db.doc("photofull/" + d.id).delete().catch(() => {}); await S.db.doc("photos/" + d.id).delete().catch(() => {}); }
      const ms = await S.db.collection("marks").where("rid", "==", rid).get();
      for (const d of ms.docs) await S.db.doc("marks/" + d.id).delete().catch(() => {});
      for (const st of STUDENTS) { await S.db.doc(subPath(st)).delete().catch(() => {}); await S.db.doc(gradePath(st)).delete().catch(() => {}); }
    }
    let pdfFile = null;
    if (file) { try { pdfFile = await withTimeout(savePdfFile(file), 180000); } catch { toast("El PDF no se subió; puedes subirlo luego en Gestión."); } }
    const next = { id: "p-" + Date.now().toString(36), title, subtitle: sub, due, pdfFile, startedAt: new Date().toISOString(), exercises: Array.from({ length: n }, (_, i) => ({ n: i + 1, title: "Ejercicio " + (i + 1), block: "alg" })) };
    await S.db.doc("exam/current").set(next);
    S.draft = null; closeModal(); confetti(); toast("Prueba nueva lista. Pon los títulos de los ejercicios."); go("gestion");
  } catch (e) { writeError(e); btn.disabled = false; btn.textContent = "Archivar y empezar"; }
}

/* ---------- subscriptions ---------- */
function subscribeRound() {
  S.unsub.forEach(u => u()); S.unsub = []; S.subs = {}; S.grades = {}; S.photos = {}; S.sel = 1;
  const rid = S.rid; if (!rid) return;
  S.unsub.push(S.db.collection("subs").where("rid", "==", rid).onSnapshot(snap => {
    snap.docs.forEach(d => { const b = d.data(); if (!b || !STUDENTS.includes(b.st)) return; if (S.dirty[subPath(b.st)]) return; S.subs[b.st] = JSON.parse(JSON.stringify(b)); });
    render();
  }, e => console.warn("subs", e)));
  let gq = S.db.collection("grades").where("rid", "==", rid);
  if (student() && !S.isOwner) gq = gq.where("st", "==", S.me).where("published", "==", true);
  S.unsub.push(gq.onSnapshot(snap => {
    if (student() && !S.isOwner) STUDENTS.forEach(x => { if (!snap.docs.some(d => d.data().st === x) && !S.dirty[gradePath(x)]) delete S.grades[x]; });
    snap.docs.forEach(d => { const b = d.data(); if (!b || !STUDENTS.includes(b.st)) return; if (S.dirty[gradePath(b.st)]) return; const was = S.grades[b.st] && S.grades[b.st].published; S.grades[b.st] = JSON.parse(JSON.stringify(b)); if (!was && b.published && S.me === b.st && !S.seenCorr[rid + b.st] && S.loadedOnce) { confetti(); toast("¡Tienes la corrección del profe!"); } });
    render();
  }, e => console.warn("grades", e)));
  resubscribePhotos();
}
let phUnsub = null, mkUnsub = null;
function resubscribePhotos() {
  if (!S.db || !S.rid || !S.me) return;
  if (phUnsub) phUnsub(); S.photos = {};
  let q = S.db.collection("photos").where("rid", "==", S.rid);
  if (student() && !S.isOwner) q = q.where("st", "==", S.me);
  phUnsub = q.onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.photos = m; render(); if (S.lb && !drawing) renderLb(); }, e => console.warn("photos", e));
  if (mkUnsub) mkUnsub(); S.marks = {};
  let mq = S.db.collection("marks").where("rid", "==", S.rid);
  S.marks = {};
  if (student() && !S.isOwner) mq = mq.where("st", "==", S.me);
  mkUnsub = mq.onSnapshot(snap => { snap.docs.forEach(d => { if (!S.dirty["marks/" + d.id]) S.marks[d.id] = JSON.parse(JSON.stringify(d.data())); }); render(); if (S.lb && !drawing && !isProfe()) renderLb(); }, e => console.warn("marks", e));
}

/* ---------- install (PWA) ---------- */
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const canInstall = () => !standalone() && (!!installEvt || isIOS());
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; renderWho(); });
addEventListener("appinstalled", () => { installEvt = null; toast("¡App instalada!"); renderWho(); });
async function doInstall() {
  if (installEvt) { installEvt.prompt(); try { await installEvt.userChoice; } catch {} installEvt = null; return renderWho(); }
  const m = $("modal");
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="in-t"><h2 id="in-t">Instalar en el iPhone</h2><ol class="ios-steps"><li>Abre esta página en <strong>Safari</strong>.</li><li>Toca el botón <strong>Compartir</strong> (el cuadrado con la flecha hacia arriba).</li><li>Elige <strong>Añadir a pantalla de inicio</strong> y toca <strong>Añadir</strong>.</li></ol><p>Tendrás la Ruta de Mates con su icono, como una app más.</p><button class="btn" data-act="closemodal">Entendido</button></div>`;
  m.hidden = false;
}
if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

/* ---------- login + roles ---------- */
const GLOGO = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function showLogin(msg) {
  S.me = null; S.started = false; renderWho(); renderTabs(); $("pdfpane").hidden = true;
  $("main").innerHTML = `<section class="card login"><svg class="lg-logo" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="12" fill="var(--accent)"/><path d="M10 31 L18 19 L24 26 L33 12" fill="none" stroke="var(--accent-ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="33" cy="12" r="3.4" fill="var(--pen)"/></svg>
    <h2>Ruta de Mates</h2><p>Exámenes de Matemáticas CCSS II con fotos, corrección del profe y tu propia ruta. Entra con tu cuenta de Google.</p>
    <button class="gbtn" data-act="login">${GLOGO}Entrar con Google</button>${msg ? `<p class="small" style="color:var(--pen)">${esc(msg)}</p>` : ""}</section>`;
}
async function signIn() {
  const auth = firebase.auth(), prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  try {
    if (standalone()) await auth.signInWithRedirect(prov);
    else await auth.signInWithPopup(prov);
  } catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { try { await auth.signInWithRedirect(prov); } catch (e2) { showLogin("No se pudo abrir el inicio de sesión: " + (e2.code || e2.message)); } }
    else if (e && e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") showLogin("No se pudo iniciar sesión: " + (e.code || e.message));
  }
}
async function claimRole(r) {
  if (!S.uid) return;
  try {
    await S.db.doc("roles/" + r).set({ uid: S.uid, at: new Date().toISOString() });
    await S.db.doc("rolesInfo/" + r).set({ uid: S.uid, email: S.userEmail || "", name: S.userName || "", at: new Date().toISOString() });
    closeModal(); toast(r === "profe" ? "Listo, eres el profe." : `¡Bienvenido, ${PNAME[r]}!`);
  } catch (e) { console.warn(e); toast("Ese perfil ya lo ha cogido otra cuenta."); }
}
function resolveRole() {
  const mine = ["profe"].concat(STUDENTS).find(r => S.roles[r] && S.roles[r].uid === S.uid);
  if (!mine) { S.me = null; S.started = false; $("main").innerHTML = '<div class="loading">Elige tu perfil para empezar.</div>'; renderWho(); renderTabs(); openPicker(); return; }
  if (!$("modal").hidden && $("modal").querySelector("#pk-t")) closeModal();
  if (S.started && S.role === mine) return;
  S.role = mine; S.isOwner = mine === "profe"; S.started = true;
  if (S.isOwner) S.db.collection("rolesInfo").onSnapshot(sn => { const m = {}; sn.docs.forEach(d => { m[d.id] = d.data(); }); S.rolesInfo = m; if (S.view === "gestion") render(); }, () => {});
  startData();
}
function startData() {
  const db = S.db;
  let me = lsGet("rm-me");
  if (S.isOwner) me = (me && (STUDENTS.includes(me) || me === "profe")) ? me : "profe"; else me = S.role;
  const slow = setTimeout(() => { if (!S.examLoaded) notice("Todavía no se pueden cargar los datos. Revisa la conexión; se actualizará solo."); }, 10000);
  db.doc("config/guia").onSnapshot(s => { S.guia = s.exists ? s.data() : null; if (S.view === "guia") { S.pdf.url = null; render(); } }, () => {});
  db.collection("avatars").onSnapshot(s => { const m = {}; s.docs.forEach(d => { if (STUDENTS.includes(d.id)) m[d.id] = d.data(); }); S.avatars = m; S.avLoaded = true; if (!S.avDraft) render(); }, () => { S.avLoaded = true; });
  db.collection("rewards").onSnapshot(s => { const m = {}; s.docs.forEach(d => { if (STUDENTS.includes(d.id)) m[d.id] = d.data(); }); S.rewards = m; render(); }, () => {});
  db.collection("history").orderBy("closedAt", "asc").onSnapshot(s => { S.history = s.docs.map(d => d.data()); render(); }, () => {});
  db.doc("exam/current").onSnapshot(s => {
    clearTimeout(slow); notice("");
    const ex = s.exists ? s.data() : null, rid = ex && ex.id;
    const pdfChanged = !S.exam || !ex || (S.exam.pdfFile || S.exam.pdfUrl) !== (ex.pdfFile || ex.pdfUrl);
    S.exam = ex; S.examLoaded = true;
    if (pdfChanged && S.view === "examen") S.pdf.url = null;
    if (rid !== S.rid) { S.rid = rid; subscribeRound(); }
    render(); setTimeout(() => { S.loadedOnce = true; }, 3000);
  }, e => { clearTimeout(slow); notice("No se ha podido cargar el examen. Recarga la página."); console.warn(e); });
  S.me = me; go(location.hash.slice(1) || viewsFor()[0][0]); resubscribePhotos();
}
async function seedExam() {
  if (!S.isOwner || S.seeding) return;
  S.seeding = true; render();
  try {
    const get = async f => { const r = await fetch(f); if (!r.ok) throw new Error(f); const b = await r.blob(); return new File([b], f.split("/").pop(), { type: "application/pdf" }); };
    const exam = await (await fetch("seed/examen-1.json")).json();
    const [pe, pg] = await Promise.all([get("seed/examen-1-enunciados.pdf"), get("seed/guia-repaso.pdf")]);
    const fe = await savePdfFile(pe), fg = await savePdfFile(pg);
    await S.db.doc("config/guia").set({ pdfFile: fg, at: new Date().toISOString() });
    await S.db.doc("exam/current").set(Object.assign(exam, { pdfFile: fe, startedAt: new Date().toISOString() }));
    confetti(); toast("Examen de repaso 1 cargado");
  } catch (e) { console.warn(e); toast("No se pudo cargar el examen de ejemplo."); }
  finally { S.seeding = false; render(); }
}

/* ---------- boot ---------- */
(function boot() {
  S.seenCorr = lsGet("rm-seen") || {};
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || /PEGA/.test(cfg.apiKey)) { $("main").innerHTML = `<section class="card login"><h2>Falta configurar Firebase</h2><p>Rellena el archivo <code>public/firebase-config.js</code> con los datos de tu proyecto (mira el README).</p></section>`; return; }
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();
  if (window.FIREBASE_EMULATOR) { fs.useEmulator("127.0.0.1", 8080); auth.useEmulator("http://127.0.0.1:9099", { disableWarnings: true }); }
  else { try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch {} }
  S.db = fs;
  $("main").innerHTML = '<div class="loading">Entrando…</div>';
  auth.getRedirectResult().catch(e => { if (e && e.code) showLogin("No se pudo iniciar sesión: " + e.code); });
  let rolesUnsub = null;
  auth.onAuthStateChanged(u => {
    if (rolesUnsub) { rolesUnsub(); rolesUnsub = null; }
    if (!u) return showLogin();
    S.uid = u.uid; S.userEmail = u.email; S.userName = u.displayName;
    rolesUnsub = fs.collection("roles").onSnapshot({ includeMetadataChanges: true }, sn => {
      if (sn.metadata.hasPendingWrites) return; // espera a que el servidor confirme el perfil antes de leer nada
      const r = {}; sn.docs.forEach(d => { r[d.id] = d.data(); }); S.roles = r; resolveRole();
    }, e => { console.warn(e); showLogin("No se puede leer la app. Revisa las reglas de Firestore."); });
  });
})();
</script>
